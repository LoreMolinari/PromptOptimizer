[project]
name = "prompt-optimizer"
version = "0.0.1"
description = "Automated prompt optimization loop"
requires-python = ">=3.10"
dependencies = [
    "sqlmodel>=0.0.18",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "mistralai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --cov=src/prompt_optimizer --cov-report=term-missing"
